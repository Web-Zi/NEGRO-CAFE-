<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negro Coffee - Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #d4af37;
            --sub-text: #b0b0b0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--accent-color);
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 2.5rem;
        }

        .category {
            margin-bottom: 40px;
        }

        .category-title {
            color: var(--accent-color);
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .item-info {
            display: flex;
            flex-direction: column;
        }

        .item-ar {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .item-en {
            font-size: 0.9rem;
            color: var(--sub-text);
        }

        .item-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
            text-align: left;
        }

        .price-single {
            white-space: nowrap;
        }

        .price-sizes {
            display: flex;
            gap: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Negro Coffee</h1>
        <p>Menu / القائمة</p>
    </header>

    <main id="menu-container"></main>

    <script src="assets/menu-data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("menu-container");
            if (!window.NEGRO_MENU) return;

            window.NEGRO_MENU.forEach(category => {
                const catSection = document.createElement("section");
                catSection.className = "category";

                const title = document.createElement("h2");
                title.className = "category-title";
                title.textContent = `${category.ar} / ${category.en}`;
                catSection.appendChild(title);

                const grid = document.createElement("div");
                grid.className = "items-grid";

                category.items.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "item-card";

                    const info = document.createElement("div");
                    info.className = "item-info";
                    info.innerHTML = `
                        <span class="item-ar">${item[1]}</span>
                        <span class="item-en">${item[2]}</span>
                    `;

                    const price = document.createElement("div");
                    price.className = "item-price";

                    if (item.length === 5) {
                        price.innerHTML = `
                            <div class="price-sizes">
                                <span>S: ${item[3]} EGP</span>
                                <span>L: ${item[4]} EGP</span>
                            </div>
                        `;
                    } else {
                        price.innerHTML = `<span class="price-single">${item[3]} EGP</span>`;
                    }

                    card.appendChild(info);
                    card.appendChild(price);
                    grid.appendChild(card);
                });

                catSection.appendChild(grid);
                container.appendChild(catSection);
            });
        });
    </script>
</body>
</html>
