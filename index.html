<!DOCTYPE html>
<html lang="en" data-theme="dark" data-lang="both">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f0d0c" />
<title>NEGRO COFFEE - Menu | منيو نيجرو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6f1; --surface:#ffffff; --surface2:#f1e9df; --text:#1d1612; --muted:#7a6a5c;
  --line:#e6dccf; --accent:#b8793a; --accent-ink:#ffffff; --shadow:0 6px 20px rgba(60,40,20,.08);
  --img-bg:#f4ece2;
}
:root[data-theme="dark"]{
  --bg:#0f0d0c; --surface:#1a1614; --surface2:#25201c; --text:#f4ece4; --muted:#a8998b;
  --line:#2f2823; --accent:#d9a066; --accent-ink:#1a120b; --shadow:0 6px 20px rgba(0,0,0,.45);
  --img-bg:#221c18;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.serif{font-family:'Playfair Display','Cairo',serif}

/* Top bar */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-row{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{height:42px;width:auto;border-radius:8px;background:#000;padding:2px}
.brand b{letter-spacing:.14em;font-size:1rem}
.ctrl{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .78rem 'Cairo',sans-serif;padding:5px 11px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--text);cursor:pointer;font-size:1rem;display:grid;place-items:center}
.search-row{max-width:1200px;margin:0 auto;padding:0 16px 8px}
.search{width:100%;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:500 .95rem 'Cairo',sans-serif;outline:none}
.search:focus{border-color:var(--accent)}
.chips{max-width:1200px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer;text-align:center;line-height:1.25;font:600 .85rem 'Cairo',sans-serif}
.chip small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.active small{color:var(--accent-ink);opacity:.85}

/* Hero */
.hero{max-width:1200px;margin:0 auto;padding:28px 16px 8px;text-align:center}
.hero h1{font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:.06em}
.hero p{color:var(--muted);margin-top:4px}
.hero .ar{font-size:1.1rem}

/* Sections */
main{max-width:1200px;margin:0 auto;padding:8px 16px 20px}
.cat{margin-top:30px;content-visibility:auto;contain-intrinsic-size:auto 900px}
.cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:14px}
.cat-head h2{font-size:1.5rem}
.cat-head .ar-t{font-size:1.35rem;font-weight:700;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.thumb{flex:none;width:92px;height:92px;border-radius:12px;background:var(--img-bg);display:grid;place-items:center;overflow:hidden;font-size:2rem}
.thumb img{width:100%;height:100%;object-fit:contain}
.info{flex:1;min-width:0}
.en{font-weight:700;font-size:1rem;line-height:1.3}
.ar-n{font-size:.95rem;color:var(--muted);direction:rtl;text-align:start;margin-top:2px}
.prices{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.price{background:var(--surface2);color:var(--accent);font-weight:800;font-size:.95rem;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.price i{font-style:normal;font-weight:600;font-size:.7rem;color:var(--muted);margin-inline-start:3px}
.empty{text-align:center;color:var(--muted);padding:40px 0;display:none}

/* Language modes */
[data-lang="en"] .ar-n,[data-lang="en"] .ar-t,[data-lang="en"] .chip small,[data-lang="en"] .hero .ar{display:none}
[data-lang="ar"] .en,[data-lang="ar"] .cat-head h2,[data-lang="ar"] .chip span,[data-lang="ar"] .hero .en-h{display:none}
[data-lang="ar"] .ar-n{color:var(--text);font-weight:700;font-size:1.05rem;margin:0}
[data-lang="ar"] .ar-t{color:var(--text)}
[data-lang="ar"] .chip small{font-size:.85rem;color:inherit;font-weight:600}
[data-lang="ar"] body,[data-lang="ar"] main{direction:rtl}
[data-lang="ar"] .cat-head{flex-direction:row}

/* Footer */
footer{background:var(--surface);border-top:1px solid var(--line);margin-top:40px;padding:30px 16px}
.foot{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.foot img{height:60px;border-radius:10px;background:#000;padding:4px}
.links{display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.links a{color:var(--text);text-decoration:none}
.links a:hover{color:var(--accent)}
.top{position:fixed;inset-inline-end:16px;bottom:16px;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.2rem;cursor:pointer;box-shadow:var(--shadow);display:none;z-index:60}
@media(max-width:520px){
  .brand b{display:none}
  .grid{grid-template-columns:1fr}
  .thumb{width:80px;height:80px}
  .foot{flex-direction:column;text-align:center}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="bar-row">
    <div class="brand"><img src="assets/Logo.png" alt="NEGRO COFFEE" onerror="this.style.display='none'"><b class="serif">NEGRO COFFEE</b></div>
    <div class="ctrl">
      <div class="seg" id="langSeg" role="group" aria-label="Language">
        <button data-l="en">EN</button><button data-l="both" class="on">EN|ع</button><button data-l="ar">ع</button>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">☀</button>
    </div>
  </div>
  <div class="search-row"><input class="search" id="search" type="search" placeholder="Search menu · ابحث في المنيو" autocomplete="off"></div>
  <nav class="chips" id="chips"></nav>
</header>

<section class="hero">
  <h1 class="serif en-h">Our Menu</h1>
  <p class="ar">قائمة المشروبات والحلويات</p>
</section>

<main id="menu"></main>
<p class="empty" id="empty">No results · لا توجد نتائج</p>

<footer>
  <div class="foot">
    <img src="assets/Logo.png" alt="NEGRO COFFEE" onerror="this.style.display='none'">
    <div class="links">
      <a href="tel:01507623027">📞 01507623027</a>
      <a href="https://www.instagram.com/negro__coffee?stkn=eHpnYzZqdGJ3bXN1" target="_blank" rel="noopener noreferrer">📷 Instagram</a>
      <a href="https://www.facebook.com/share/18LSA3NdWD/" target="_blank" rel="noopener noreferrer">👍 Facebook</a>
      <span>📍 شارع احمد عرابي و حديقه فريال بورسعيد</span>
    </div>
  </div>
</footer>
<button class="top" id="top" aria-label="Back to top">↑</button>

<script src="assets/menu-data.js"></script>
<script>
(function(){
  var root=document.documentElement, KEY_T='negro-theme', KEY_L='negro-lang';
  function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

  /* Theme */
  var themeBtn=document.getElementById('themeBtn');
  function setTheme(t){root.setAttribute('data-theme',t);themeBtn.textContent=t==='dark'?'☀':'☾';
    document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0f0d0c':'#faf6f1'}
  var saved=load(KEY_T);
  setTheme(saved||(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
  themeBtn.onclick=function(){var t=root.getAttribute('data-theme')==='dark'?'light':'dark';setTheme(t);store(KEY_T,t)};

  /* Language */
  var segBtns=document.querySelectorAll('#langSeg button');
  function setLang(l){root.setAttribute('data-lang',l);
    root.setAttribute('dir',l==='ar'?'rtl':'ltr');
    segBtns.forEach(function(b){b.classList.toggle('on',b.dataset.l===l)});}
  segBtns.forEach(function(b){b.onclick=function(){setLang(b.dataset.l);store(KEY_L,b.dataset.l)}});
  setLang(load(KEY_L)||'both');

  /* Data */
  var data=window.NEGRO_MENU||[];
  var chips=document.getElementById('chips'), menu=document.getElementById('menu');
  if(!data.length){
    menu.innerHTML='<div style="text-align:center;padding:50px 16px;line-height:2"><b>Menu data not found · لم يتم العثور على بيانات المنيو</b><br>Put this file next to the <code>assets</code> folder (it must contain <code>menu-data.js</code>).<br>ضع هذا الملف بجانب مجلد <code>assets</code> الذي يحتوي على <code>menu-data.js</code></div>';
  }
  var icons={hot:'☕',cold:'🧊',dessert:'🍰'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function slug(s,i){return 'cat-'+i}

  data.forEach(function(cat,ci){
    var cid=slug(cat.id,ci);
    var chip=document.createElement('button');
    chip.className='chip';chip.dataset.t=cid;
    chip.innerHTML='<span>'+esc(cat.en)+'</span><small>'+esc(cat.ar)+'</small>';
    chip.onclick=function(){var el=document.getElementById(cid);if(el)el.scrollIntoView({behavior:'smooth'})};
    chips.appendChild(chip);

    var sec=document.createElement('section');sec.className='cat';sec.id=cid;
    var html='<div class="cat-head"><h2 class="serif">'+esc(cat.en)+'</h2><span class="ar-t">'+esc(cat.ar)+'</span></div><div class="grid">';
    cat.items.forEach(function(it){
      var prices=[],img='';
      for(var i=3;i<it.length;i++){
        if(typeof it[i]==='number')prices.push(it[i]);
        else if(typeof it[i]==='string'&&/\.(png|jpe?g|webp|gif)$/i.test(it[i].trim()))img=it[i].trim();
      }
      var thumb=img?'<img loading="lazy" decoding="async" src="'+esc(img)+'" alt="'+esc(it[1])+'" onerror="this.parentNode.textContent=\''+(icons[cat.image]||'☕')+'\'">':(icons[cat.image]||'☕');
      var labels=prices.length===2?['S','L']:[];
      var ph=prices.map(function(p,i){return '<span class="price">'+p+'<i>EGP'+(labels[i]?' '+labels[i]:'')+'</i></span>'}).join('');
      var key=(it[1]+' '+it[2]).toLowerCase();
      html+='<article class="card" data-k="'+esc(key)+'"><div class="thumb">'+thumb+'</div><div class="info"><div class="en">'+esc(it[1])+'</div><div class="ar-n">'+esc((it[2]||'').trim())+'</div><div class="prices">'+ph+'</div></div></article>';
    });
    sec.innerHTML=html+'</div>';
    menu.appendChild(sec);
  });

  /* Search */
  var empty=document.getElementById('empty');
  document.getElementById('search').addEventListener('input',function(e){
    var q=e.target.value.trim().toLowerCase(),any=false;
    document.querySelectorAll('.cat').forEach(function(sec){
      var shown=0;
      sec.querySelectorAll('.card').forEach(function(c){
        var m=!q||c.dataset.k.indexOf(q)>-1;c.style.display=m?'':'none';if(m)shown++;
      });
      sec.style.display=shown?'':'none';if(shown)any=true;
    });
    empty.style.display=any?'none':'block';
  });

  /* Active chip on scroll */
  var secs=document.querySelectorAll('.cat');
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(en){
        if(en.isIntersecting){
          document.querySelectorAll('.chip').forEach(function(c){
            var on=c.dataset.t===en.target.id;c.classList.toggle('active',on);
            if(on){var x=c.offsetLeft-(chips.clientWidth-c.offsetWidth)/2;chips.scrollTo({left:x,behavior:'auto'});}
          });
        }
      });
    },{rootMargin:'-160px 0px -65% 0px'});
    secs.forEach(function(s){io.observe(s)});
  }

  /* Back to top */
  var top=document.getElementById('top');
  var tick=false;
  window.addEventListener('scroll',function(){
    if(tick)return;tick=true;
    requestAnimationFrame(function(){top.style.display=window.scrollY>600?'block':'none';tick=false});
  },{passive:true});
  top.onclick=function(){window.scrollTo({top:0,behavior:'smooth'})};
})();
</script>
</body>
</html>
